<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient (md-tech-slide Presentation Orange) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Slide Canvas -->
    <filter id="slideShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Drop Shadow for Badge -->
    <filter id="badgeShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Base: Presentation Orange Squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow/Border -->
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- Presentation Slide Canvas (16:9 Landscape Card) -->
  <g filter="url(#slideShadow)">
    <!-- Main Slide Body -->
    <rect x="32" y="44" width="192" height="126" rx="10" fill="#FFFFFF" />

    <!-- Slide Header Bar Area -->
    <path d="M 32 54 A 10 10 0 0 1 42 44 H 214 A 10 10 0 0 1 224 54 V 68 H 32 Z" fill="#FFF3E0" />
    <line x1="32" y1="68" x2="224" y2="68" stroke="#FFE0B2" stroke-width="1" />
    <circle cx="44" cy="56" r="3" fill="#FF7043" />
    <circle cx="53" cy="56" r="3" fill="#FFA726" />
    <circle cx="62" cy="56" r="3" fill="#81C784" />
    <line x1="76" y1="56" x2="140" y2="56" stroke="#D84315" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Slide Content Grid (Columns & Code) -->
  <g transform="translate(44, 78)">
    <!-- Column 1: Markdown Symbol & Code Block -->
    <g transform="translate(0, 0)">
      <!-- Markdown Symbol Box -->
      <rect x="0" y="0" width="56" height="32" rx="4" fill="none" stroke="#D84315" stroke-width="2.5" />
      <!-- M letter -->
      <path d="M 9 24 V 9 L 18 17 L 27 9 V 24" fill="none" stroke="#D84315" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Down Arrow -->
      <path d="M 41 9 V 21 M 36 16 L 41 21 L 46 16" fill="none" stroke="#D84315" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Miniature Code Block -->
      <rect x="0" y="38" width="56" height="42" rx="4" fill="#263238" />
      <line x1="6" y1="48" x2="38" y2="48" stroke="#80CBC4" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="56" x2="48" y2="56" stroke="#FFCC80" stroke-width="2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="32" y2="64" stroke="#81D4FA" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="72" x2="42" y2="72" stroke="#EF9A9A" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Column 2: Presentation Layout (Slot 1) -->
    <g transform="translate(62, 0)">
      <rect x="0" y="0" width="48" height="80" rx="4" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1.8" />
      <line x1="6" y1="12" x2="36" y2="12" stroke="#E65100" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="22" x2="42" y2="22" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="30" x2="38" y2="30" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="38" x2="32" y2="38" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />

      <!-- Mini Chart / Box inside slot -->
      <rect x="6" y="46" width="36" height="26" rx="2" fill="#FFE0B2" stroke="#FF9800" stroke-width="1" />
      <line x1="12" y1="66" x2="12" y2="56" stroke="#E65100" stroke-width="3" stroke-linecap="round" />
      <line x1="19" y1="66" x2="19" y2="52" stroke="#FB8C00" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="66" x2="26" y2="58" stroke="#FFA726" stroke-width="3" stroke-linecap="round" />
      <line x1="33" y1="66" x2="33" y2="50" stroke="#FF7043" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Column 3: Presentation Layout (Slot 2) -->
    <g transform="translate(116, 0)">
      <rect x="0" y="0" width="48" height="80" rx="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.8" />
      <line x1="6" y1="12" x2="32" y2="12" stroke="#37474F" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="22" x2="40" y2="22" stroke="#78909C" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="30" x2="36" y2="30" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="38" x2="28" y2="38" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />

      <!-- Diagram Shapes inside slot -->
      <circle cx="15" cy="58" r="6" fill="#FFFFFF" stroke="#00838F" stroke-width="1.5" />
      <circle cx="33" cy="58" r="6" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5" />
      <line x1="21" y1="58" x2="27" y2="58" stroke="#00838F" stroke-width="1.5" />
    </g>
  </g>

  <!-- SLIDE Badge (Bottom Right Accent) -->
  <g filter="url(#badgeShadow)">
    <rect x="136" y="184" width="86" height="32" rx="6" fill="#D84315" />
    <text x="179" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SLIDE</text>
  </g>
</svg>
