<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Presentation Screen (Dark theme: #C5C5C5) -->
  <rect x="1.5" y="2" width="13" height="9" rx="1" fill="none" stroke="#C5C5C5" stroke-width="1.2" />
  <!-- Stand / Tripod -->
  <line x1="8" y1="11" x2="8" y2="14" stroke="#C5C5C5" stroke-width="1.2" stroke-linecap="round" />
  <line x1="5" y1="14" x2="11" y2="14" stroke="#C5C5C5" stroke-width="1.2" stroke-linecap="round" />

  <!-- Slide Header Bar (Brand Accent: #007ACC) -->
  <line x1="3.5" y1="4.2" x2="8.5" y2="4.2" stroke="#007ACC" stroke-width="1.2" stroke-linecap="round" />

  <!-- Multi-Column Layout Indicator -->
  <rect x="3.5" y="6" width="3.8" height="3.5" rx="0.5" fill="#007ACC" fill-opacity="0.4" stroke="#007ACC" stroke-width="0.8" />
  <rect x="8.7" y="6" width="3.8" height="3.5" rx="0.5" fill="#C5C5C5" fill-opacity="0.25" stroke="#C5C5C5" stroke-width="0.8" />
</svg>
